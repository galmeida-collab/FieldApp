<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>African Enterprise - Testimony Capture</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EA580C">
  <style>
    :root {
      --primary: #EA580C;
      --primary-dark: #C2410C;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding-bottom: 80px; }
    
    /* Top Header */
    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 38px; height: 38px; object-fit: contain; }
    .brand-title { font-size: 1.05rem; font-weight: 700; color: #1E293B; line-height: 1.2; }
    .brand-sub { font-size: 0.75rem; color: var(--text-muted); }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: #DCFCE7;
      color: #166534;
    }
    .status-badge.offline { background: #FEE2E2; color: #991B1B; }

    /* Content Area */
    .tab-content { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* Form Card */
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h3 { font-size: 1rem; margin-bottom: 12px; color: var(--text-main); font-weight: 600; }
    
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      background: #FFF;
    }
    textarea { min-height: 85px; resize: vertical; }

    /* Tag Pills */
    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag-pill {
      background: #F1F5F9;
      color: #475569;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }
    .tag-pill.active { background: #FFEDD5; color: var(--primary-dark); border-color: var(--primary); font-weight: 600; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #FFF;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn:active { background: var(--primary-dark); }
    .btn-secondary { background: #E2E8F0; color: #334155; margin-top: 8px; }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      background: none;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }

    /* Footer Versioning */
    footer { text-align: center; padding: 16px; font-size: 0.75rem; color: #94A3B8; }
  </style>
</head>
<body>

  <!-- Top Header (No v1.0.0 text) -->
  <header>
    <div class="brand-wrap">
      <img src="AESA General Name Logo 2022.png" alt="AE" class="brand-logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">African Enterprise</div>
        <div class="brand-sub">Harvest Time Testimony Capture</div>
      </div>
    </div>
    <div id="connStatus" class="status-badge">Online</div>
  </header>

  <!-- TAB 1: CAPTURE -->
  <main id="tab-capture" class="tab-content active">
    <!-- Block 1: Details -->
    <div class="card">
      <h3>1. Story Details</h3>
      <label>Person's Name</label>
      <input type="text" id="personName" placeholder="e.g. Sipho Ndlovu">
      
      <label>Location / City</label>
      <input type="text" id="personLocation" placeholder="e.g. Soweto Outreach">

      <label>Reporter (Your Name)</label>
      <input type="text" id="reporterName" placeholder="AE Staff / Mission Team">
    </div>

    <!-- Block 2: Testimony Focus (Tags) -->
    <div class="card">
      <h3>2. Key Focus Tags</h3>
      <div class="tag-container" id="tagList">
        <span class="tag-pill" onclick="toggleTag(this)">+ Salvation</span>
        <span class="tag-pill" onclick="toggleTag(this)">+ Recommitment</span>
        <span class="tag-pill" onclick="toggleTag(this)">+ Healing</span>
      </div>
      
      <label>Life Before Christ</label>
      <textarea id="beforeLife" placeholder="Briefly describe their background or struggle..."></textarea>

      <label>Outreach Encounter</label>
      <textarea id="encounter" placeholder="What happened when the gospel was shared?"></textarea>

      <label>How They Feel Now</label>
      <textarea id="feelNow" placeholder="Changes in attitude, hope, or perspective..."></textarea>
    </div>

    <!-- Block 3: Media & Save -->
    <div class="card">
      <h3>3. Media & Save</h3>
      <label>Attach Photos / Media</label>
      <input type="file" id="mediaUpload" accept="image/*,video/*" multiple>
      <button class="btn" onclick="saveToOfflineCache()">Save Story Offline</button>
    </div>
  </main>

  <!-- TAB 2: CACHE (Streamlined, No Drive Box) -->
  <main id="tab-cache" class="tab-content">
    <div class="card">
      <h3>Saved on Device</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">
        Stories waiting to sync to the Comms folder.
      </p>
      <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px;" id="cacheCount">0 Pending</div>
      <button class="btn" onclick="triggerSync()">Upload All (Wi-Fi)</button>
    </div>

    <div id="cachedItemsList"></div>
  </main>

  <!-- Footer Versioning -->
  <footer>
    African Enterprise South Africa • v1.0.0
  </footer>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-capture', this)">
      <span>📝</span>
      <span>Capture</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-cache', this)">
      <span>☁️</span>
      <span>Cache</span>
    </button>
  </nav>

  <script>
    // Tab switching (silent)
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
      if (tabId === 'tab-cache') renderCache();
    }

    // Tag selector
    function toggleTag(pill) {
      pill.classList.toggle('active');
    }

    // Cache management
    function getCache() {
      return JSON.parse(localStorage.getItem('ae_testimonies') || '[]');
    }

    function saveToOfflineCache() {
      const person = document.getElementById('personName').value;
      if (!person) { alert('Please enter a name.'); return; }

      const activeTags = Array.from(document.querySelectorAll('.tag-pill.active')).map(p => p.innerText.replace('+ ', ''));

      const entry = {
        id: Date.now(),
        person: person,
        location: document.getElementById('personLocation').value,
        reporter: document.getElementById('reporterName').value,
        tags: activeTags,
        beforeLife: document.getElementById('beforeLife').value,
        whatHappened: document.getElementById('encounter').value,
        nowFeelings: document.getElementById('feelNow').value,
        savedAt: new Date().toLocaleString()
      };

      const items = getCache();
      items.push(entry);
      localStorage.setItem('ae_testimonies', JSON.stringify(items));

      // Reset
      document.getElementById('personName').value = '';
      document.getElementById('beforeLife').value = '';
      document.getElementById('encounter').value = '';
      document.getElementById('feelNow').value = '';
      document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));

      alert('Saved locally! Go to Cache tab when you have Wi-Fi to upload.');
    }

    function renderCache() {
      const items = getCache();
      document.getElementById('cacheCount').innerText = `${items.length} Pending`;
      const list = document.getElementById('cachedItemsList');
      list.innerHTML = '';

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <strong>${item.person}</strong> (${item.location || 'Field'})
          <p style="font-size: 0.8rem; color: #64748B;">Saved: ${item.savedAt} • Tags: ${item.tags.join(', ') || 'None'}</p>
        `;
        list.appendChild(div);
      });
    }

    function triggerSync() {
      const items = getCache();
      if (items.length === 0) {
        alert('No pending stories to upload.');
        return;
      }
      alert('Uploading stories to the central African Enterprise repository...');
    }

    // Network check
    window.addEventListener('online', () => {
      document.getElementById('connStatus').className = 'status-badge';
      document.getElementById('connStatus').innerText = 'Online';
    });
    window.addEventListener('offline', () => {
      document.getElementById('connStatus').className = 'status-badge offline';
      document.getElementById('connStatus').innerText = 'Offline';
    });
  </script>
</body>
</html>
