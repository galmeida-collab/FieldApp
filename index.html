<!DOCTYPE html>
<html lang="en-ZA" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>African Enterprise - Mission Field Tool</title>
  
  <!-- Local Offline-Ready Compiled Tailwind CSS -->
  <link rel="stylesheet" href="css/app.css">
  
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-950 text-slate-100 min-h-dvh flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- STICKY TOP HEADER -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/90 px-4 py-3 shadow-sm">
    <div class="max-w-md lg:max-w-5xl mx-auto grid grid-cols-3 items-center">
      <div class="flex items-center justify-start">
        <img src="punch-icon.png" alt="AE Emblem" class="h-20 w-20 object-contain rounded-md" onerror="this.parentElement.innerHTML='<span class=\'font-black text-slate-800\'>AE</span>'">
      </div>

      <div class="text-center">
        <h1 class="text-xs font-extrabold uppercase tracking-wider text-slate-800">Mission Field Tool</h1>
      </div>

      <div class="flex items-center justify-end">
        <div id="connStatus" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Online</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-1 max-w-md lg:max-w-5xl w-full mx-auto px-4 py-6 pb-24">
    <div id="app-view">
      <div class="text-center py-12">
        <p class="text-slate-400 text-sm">Loading Mission Field Tool v1.4...</p>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2" style="padding-bottom: env(safe-area-inset-bottom, 0.5rem);">
    <div class="max-w-md lg:max-w-5xl mx-auto flex justify-around items-center">
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 text-xs font-medium transition-colors" data-tab="home">
        <span>🏠</span>
        <span>Home</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 text-xs font-medium transition-colors" data-tab="stories">
        <span>📖</span>
        <span>Stories</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 text-xs font-medium transition-colors" data-tab="outreach">
        <span>📊</span>
        <span>Outreach</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 text-xs font-medium transition-colors" data-tab="cache">
        <span>💾</span>
        <span>Cache</span>
      </button>
    </div>
  </nav>

  <!-- Core App Entrypoint Module -->
  <script type="module">
    import { setConnStatus } from './js/ui.js';
    import { initPillarDropdowns } from './js/forms.js';
    import { requestPersistence } from './js/db.js';

    window.addEventListener('DOMContentLoaded', async () => {
      await requestPersistence();
      setConnStatus(navigator.onLine);
      window.addEventListener('online', () => setConnStatus(true));
      window.addEventListener('offline', () => setConnStatus(false));
      initPillarDropdowns();

      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch (err) {
          console.error('Service Worker registration failed:', err);
        }
      }
    });
  </script>
</body>
</html>
